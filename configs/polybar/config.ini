;==========================================================
; Polybar — Raspberry Pi setup
; Based on mrczlnks config, adapted for Pi OS (Debian)
;==========================================================

[colors]
background     = #00000000
foreground     = #ccffffff
foreground-alt = #888888
primary        = #bd93f9
secondary      = #ff79c6
alert          = #ff5555
green          = #50fa7b
yellow         = #f1fa8c
cyan           = #8be9fd

[bar/main]
width          = 100%
height         = 20
radius         = 0.0
fixed-center   = false
bottom         = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size  = 2
line-color = ${colors.primary}

border-size  = 0
border-color = #00000000

padding-left  = 1
padding-right = 2

module-margin-left  = 1
module-margin-right = 2

enable-ipc = true

; Fonts — install with: sudo apt install fonts-jetbrains-mono
font-0 = JetBrains Mono:pixelsize=10;2
font-1 = Font Awesome 6 Free:style=Solid:pixelsize=10;2
font-2 = Font Awesome 6 Brands:pixelsize=10;2

modules-left   = i3
modules-center =
modules-right  = cpu memory temperature wlan eth date powermenu

tray-position  = right
tray-padding   = 4

cursor-click  = pointer
cursor-scroll = ns-resize

override-redirect = true

[module/i3]
type           = internal/i3
format         = <label-state> <label-mode>
index-sort     = true
wrapping-scroll = false

label-mode-padding    = 2
label-mode-foreground = #000000
label-mode-background = ${colors.primary}

label-focused            = %index%
label-focused-background = #44475a
label-focused-underline  = ${colors.primary}
label-focused-padding    = 2

label-unfocused         = %index%
label-unfocused-padding = 2

label-visible            = %index%
label-visible-background = ${self.label-focused-background}
label-visible-underline  = ${self.label-focused-underline}
label-visible-padding    = ${self.label-focused-padding}

label-urgent            = %index%!
label-urgent-background = ${colors.alert}
label-urgent-padding    = 2

[module/cpu]
type     = internal/cpu
interval = 1.0
format   = <label> <ramp-coreload>
label    = CPU

ramp-coreload-0 = ▁
ramp-coreload-1 = ▂
ramp-coreload-2 = ▃
ramp-coreload-3 = ▄
ramp-coreload-4 = ▅
ramp-coreload-5 = ▆
ramp-coreload-6 = ▇
ramp-coreload-7 = █

ramp-coreload-0-foreground = ${colors.green}
ramp-coreload-1-foreground = ${colors.green}
ramp-coreload-2-foreground = ${colors.green}
ramp-coreload-3-foreground = ${colors.yellow}
ramp-coreload-4-foreground = ${colors.yellow}
ramp-coreload-5-foreground = ${colors.alert}
ramp-coreload-6-foreground = ${colors.alert}
ramp-coreload-7-foreground = ${colors.alert}

[module/memory]
type     = internal/memory
interval = 3
format   = <label> <bar-used>
label    = RAM

bar-used-width       = 10
bar-used-fill        = ─
bar-used-empty       = ─
bar-used-indicator   = |

bar-used-foreground-0 = ${colors.green}
bar-used-foreground-1 = ${colors.green}
bar-used-foreground-2 = ${colors.yellow}
bar-used-foreground-3 = ${colors.alert}

bar-used-empty-foreground    = #444444
bar-used-indicator-foreground = #ffffff

[module/temperature]
type          = internal/temperature
; Pi 5 thermal zone — adjust if readings seem wrong
thermal-zone  = 0
warn-temperature = 70

format      = <ramp> <label>
format-warn = <ramp> <label-warn>

label               = %temperature-c%
label-warn          = %temperature-c%
label-warn-foreground = ${colors.alert}

ramp-0            = 
ramp-1            = 
ramp-2            = 
ramp-foreground   = ${colors.foreground-alt}

[module/wlan]
type      = internal/network
; Change to your Pi's WiFi interface (check with: ip link)
interface = wlan0
interval  = 3.0

format-connected            = <ramp-signal> <label-connected>
format-connected-underline  = ${colors.primary}
label-connected             = %essid%

format-disconnected =

ramp-signal-0 = 
ramp-signal-1 = 
ramp-signal-2 = 
ramp-signal-3 = 
ramp-signal-4 = 
ramp-signal-foreground = ${colors.foreground-alt}

[module/eth]
type      = internal/network
; Change to your Pi's Ethernet interface (check with: ip link)
interface = eth0
interval  = 3.0

format-connected-underline  = ${colors.green}
format-connected-prefix     = " "
format-connected-prefix-foreground = ${colors.foreground-alt}
label-connected             = %local_ip%

format-disconnected =

[module/date]
type     = internal/date
interval = 1
date     = %%{F#999}%Y-%m-%d%%{F-}  %%{F#fff}%H:%M:%S%%{F-}
date-alt = %%{F#fff}%A, %d %B %Y  %%{F#fff}%H:%M%%{F#666}:%%{F#bd93f9}%S%%{F-}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume> <bar-volume>
label-volume  = VOL %percentage%%
label-volume-foreground = ${root.foreground}

label-muted             = muted
label-muted-foreground  = #666666

bar-volume-width       = 8
bar-volume-fill        = ─
bar-volume-empty       = ─
bar-volume-indicator   = |

bar-volume-foreground-0 = ${colors.green}
bar-volume-foreground-1 = ${colors.green}
bar-volume-foreground-2 = ${colors.green}
bar-volume-foreground-3 = ${colors.yellow}
bar-volume-foreground-4 = ${colors.yellow}
bar-volume-foreground-5 = ${colors.yellow}
bar-volume-foreground-6 = ${colors.alert}

bar-volume-gradient           = false
bar-volume-indicator-font     = 1
bar-volume-fill-font          = 1
bar-volume-empty-font         = 1
bar-volume-empty-foreground   = #444444
bar-volume-indicator-foreground = #ffffff

[module/powermenu]
type = custom/menu

expand-right = true
format-spacing = 1

label-open            = 
label-open-foreground = ${colors.secondary}
label-close           = cancel
label-close-foreground = ${colors.secondary}
label-separator       = |
label-separator-foreground = ${colors.foreground-alt}

menu-0-0 = reboot
menu-0-0-exec = menu-open-1
menu-0-1 = power off
menu-0-1-exec = menu-open-2

menu-1-0 = cancel
menu-1-0-exec = menu-open-0
menu-1-1 = reboot
menu-1-1-exec = systemctl reboot

menu-2-0 = power off
menu-2-0-exec = systemctl poweroff
menu-2-1 = cancel
menu-2-1-exec = menu-open-0

[settings]
screenchange-reload = true

[global/wm]
margin-top    = 0
margin-bottom = 0

; vim:ft=dosini
